name: Native Android

# Builds the React Native release APK, store-signed, and attaches it to the version release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to attach the APK to (e.g. v1.8.0)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses >/dev/null
          "$SDKMAN" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/splitupi-release.jks"

      - name: Build native release APKs (per architecture)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/splitupi-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Attach APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APKDIR="android/app/build/outputs/apk/release"
          cp "$APKDIR/app-armeabi-v7a-release.apk" "$GITHUB_WORKSPACE/splitupi-native-${TAG}-arm32.apk"
          cp "$APKDIR/app-arm64-v8a-release.apk" "$GITHUB_WORKSPACE/splitupi-native-${TAG}-arm64.apk"
          cp "$APKDIR/app-x86_64-release.apk" "$GITHUB_WORKSPACE/splitupi-native-${TAG}-x64.apk"
          cd "$GITHUB_WORKSPACE"
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --notes "Native Android build."
          gh release upload "${TAG}" splitupi-native-${TAG}-arm32.apk splitupi-native-${TAG}-arm64.apk splitupi-native-${TAG}-x64.apk --clobber
