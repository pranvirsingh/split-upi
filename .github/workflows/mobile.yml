name: Native Android

# Builds the React Native debug APK and attaches it to the version release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to attach the APK to (e.g. v1.8.0)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses >/dev/null
          "$SDKMAN" "cmdline-tools;latest" "platform-tools" >/dev/null
          yes | "$SDKMAN" --licenses >/dev/null
          "$SDKMAN" "platforms;android-37" "build-tools;37.0.0"

      - run: npm ci
      - run: npm run typecheck

      - name: Build native debug APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ../splitupi-native-${TAG}.apk
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --notes "Native Android build."
          gh release upload "${TAG}" ../splitupi-native-${TAG}.apk --clobber
