name: Android

# Builds the debug APK and attaches it to the matching version release.
# Runs when a version tag (v*) is pushed — after the release notes exist.
on:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk splitupi-${{ github.ref_name }}.apk
          gh release view ${{ github.ref_name }} >/dev/null 2>&1 || gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "Android build."
          gh release upload ${{ github.ref_name }} splitupi-${{ github.ref_name }}.apk --clobber
